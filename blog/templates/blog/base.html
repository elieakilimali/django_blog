<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mon Blog{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <header class="bg-blue-600 text-white p-4">
        <nav class="container mx-auto flex justify-between">
            <a href="{% url 'home' %}" class="text-2xl font-bold">Mon Blog</a>
            <ul class="flex space-x-4">
                <li><a href="{% url 'post_list' %}">Articles</a></li>
                <li><a href="{% url 'post_create' %}">Créer un article</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mx-auto py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-blue-600 text-white text-center p-4">
        <p>&copy; 2025 Mon Blog. Tous droits réservés.</p>
    </footer>
</body>
</html>
