{% extends 'blog/base.html' %}

{% block title %}Supprimer l'article{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-4">Supprimer l'article</h1>
<p>Es-tu sûr de vouloir supprimer cet article ?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="bg-red-500 text-white px-4 py-2">Confirmer</button>
    <a href="{% url 'post_list' %}" class="text-blue-500 ml-4">Annuler</a>
</form>
{% endblock %}
